[package]
title = "FindSurface Omniverse App"
version = "1.0.0"
description = "Point-cloud import, viewport picking, visualization, workspace, and geometry export workflows built on the reusable FindSurface extension."
category = "example"
keywords = ["findsurface", "curvsurf", "geometry", "detection", "pointcloud", "cad", "3d-data-processing", "demo"]

[package.target]
kit = ["110.1.2"]
platform = ["windows-x86_64", "linux-x86_64"]

[dependencies]
"omni.ui" = {}
"omni.ui.scene" = {}
"omni.appwindow" = {}
"omni.kit.actions.core" = {}
"omni.kit.menu.utils" = {}
"omni.kit.window.filepicker" = {}
"omni.usd" = {}
"com.findsurface.bootstrap" = {}

[[python.module]]
name = "findsurface_omniverse.extension"
